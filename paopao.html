<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>熱蠟工作室-泡泡🫧</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: top bar + slide-in menu; home = hero + numbered resource cards; each resource opens as its own view; edit mode opens a bottom sheet */
:root{
  --bg:#E9DAC6; --paper:#F6EEE3; --ink:#3F2F25; --muted:#7E6855; --line:#D5C0A5;
  --khaki:#A6845F; --tea:#D8BE9E; --coffee:#6B4C36; --soft:#DFCBB2; --danger:#A3412E;
  --latin:"Cormorant Garamond",Georgia,serif;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
/* single milk-tea look in every theme */
*{box-sizing:border-box}
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,textarea,select{font-size:16px!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--khaki);outline-offset:2px}
a{color:var(--coffee)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.icon-btn{border:1px solid var(--line);background:var(--paper);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px;flex:none}
.brand{flex:1;min-width:0;line-height:1.2}
.brand b{font-family:var(--latin);font-size:18px;letter-spacing:.12em;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-size:10px;letter-spacing:.22em;color:var(--muted)}
.home-link{border:0;background:none;color:var(--coffee);cursor:pointer;font-size:14px}
.edit-toggle{border:1px solid var(--coffee);background:none;color:var(--coffee);border-radius:999px;padding:5px 14px;font-size:13px;cursor:pointer}
body.editing .edit-toggle{background:var(--coffee);color:var(--paper)}
.edit-banner{background:var(--coffee);color:var(--paper);font-size:13px;text-align:center;padding-block:6px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(40,30,22,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(330px,88vw);z-index:50;background:var(--paper);transform:translateX(-102%);transition:transform .3s ease;display:flex;flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));overflow-y:auto}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .drawer{transform:none}
.drawer .top{display:flex;justify-content:space-between;align-items:center}
.drawer .lbl{font-family:var(--latin);letter-spacing:.2em;font-size:13px;color:var(--muted);margin:22px 0 8px}
.drawer nav{display:grid}
.drawer nav button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 2px;cursor:pointer}
.drawer nav button span:last-child{color:var(--muted);font-size:12px;white-space:nowrap}
.drawer nav .sub-item{padding-left:16px;font-size:14px}
.drawer .foot{margin-top:auto;padding-top:20px;font-size:12px;color:var(--muted)}

/* hero */
.hero{padding-block:48px 36px}
.eyebrow{font-family:var(--latin);letter-spacing:.3em;font-size:13px;color:var(--khaki);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,7vw,46px);line-height:1.3;margin:12px 0 16px;text-wrap:balance}
.hero p{color:var(--muted);max-width:34em;margin:0;white-space:pre-line}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.cta{border:1px solid var(--coffee);background:var(--coffee);color:var(--paper);padding:11px 20px;border-radius:999px;cursor:pointer}
.cta.ghost{background:none;color:var(--coffee)}
.cta:disabled{opacity:.6;cursor:wait}

/* section heads */
.sec{padding-block:28px}
.sec-head{display:grid;gap:4px;margin-bottom:20px}
h2{font-family:var(--display);font-size:clamp(22px,4.5vw,28px);margin:0;text-wrap:balance}
.sec-head p{margin:0;color:var(--muted)}
h3{font-size:17px;margin:0}

/* resource cards */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.cards{gap:10px}.rcard{padding:14px;border-radius:14px}.rcard .no{font-size:24px}.rcard h3{font-size:15px}.rcard p{font-size:12.5px}.rcard .meta{font-size:11px}}
.rcard{display:grid;grid-template-rows:auto auto 1fr auto;gap:6px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;transition:border-color .2s,transform .2s}
.rcard:hover{border-color:var(--khaki);transform:translateY(-2px)}
.rcard .no{font-family:var(--latin);font-size:30px;color:var(--khaki);line-height:1}
.rcard p{margin:0;color:var(--muted);font-size:14px}
.rcard .meta{margin-top:10px;font-size:12px;color:var(--coffee);border-top:1px dashed var(--line);padding-top:10px}

.quote{background:var(--soft);border-radius:16px;padding:24px;text-align:center}
.quote b{font-family:var(--display);font-size:19px;display:block;margin-bottom:6px}
.quote p{margin:0;color:var(--muted);white-space:pre-line}
.notice{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--paper)}
.notice p{margin:6px 0 0;color:var(--muted);font-size:14px;white-space:pre-line}

/* views */
.view{padding-block:24px 64px;display:grid;gap:18px}
.back{justify-self:start;border:0;background:none;color:var(--coffee);cursor:pointer;padding:0;font-size:14px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px;min-width:0}
.tip{background:var(--soft);border-radius:14px;padding:16px 18px;display:grid;gap:8px;min-width:0}
.tip h3{color:var(--coffee)}
.tip p{margin:0}
.small{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;padding:1px 9px;border-radius:999px;background:var(--tea);color:var(--ink);font-weight:500;white-space:nowrap}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.btn{border:1px solid var(--khaki);background:none;color:var(--coffee);font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer}
.btn.done{background:var(--coffee);border-color:var(--coffee);color:var(--paper)}
.ed{display:none!important}
body.editing .ed{display:inline-flex!important}
.btn.ed{border-style:dashed}
.btn.del{border-color:var(--danger);color:var(--danger)}
.btn.del.armed{background:var(--danger);color:var(--paper);border-style:solid}
.add{justify-self:start}
.empty{border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);text-align:center}
ul.clean{margin:0;padding-left:1.2em}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:13px}
pre.tpl{white-space:pre-wrap;font-family:var(--body);font-size:14px;background:var(--bg);border-radius:10px;padding:14px;margin:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:0}
.check input{margin-top:6px;accent-color:var(--coffee);width:16px;height:16px;flex:none}
.check>span{flex:1;min-width:0}
.check>span.acts{flex:none}
.check small{display:block;color:var(--muted)}
.chkhead .cta{margin-top:4px}
.chkcount{font-size:15px;color:var(--ink);padding-top:2px}
.chkcount b{font-size:18px;color:var(--coffee)}
.chkg{display:flex;align-items:center;gap:6px}
.dlrow{display:grid;gap:8px}
.dlrow .dl{width:100%;justify-content:center;text-align:center;padding-block:10px}
.dlrow .dlpdf{background:var(--coffee);color:var(--paper);border-color:var(--coffee)}
.dlimgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlimgs .dl:last-child:nth-child(odd){grid-column:1/-1}
.blk .bsub{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.blk .bsub h3{font-size:18px;margin:0}
.gdesc{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:1.75;color:var(--muted);white-space:pre-line}
.chkhlrow{margin-bottom:-4px}
.gno{font-weight:400}
.check{flex-wrap:wrap}
.refimg{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:0 0 calc(100% - 26px);margin:2px 0 4px 26px;min-width:0}
.ri{display:grid;gap:4px;text-decoration:none;color:inherit;cursor:zoom-in;min-width:0}
.ri-box{display:block;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px}
.ri img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain}
.ri small{font-size:12px;color:var(--muted)}

/* FAQ */
.faq-hero{text-align:center;display:grid;gap:8px;padding-top:8px}
.faq-hero p{margin:0;color:var(--muted)}
.searchbox{position:relative}
.searchbox .search{padding-right:48px}
.search::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.sclear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:var(--tea);color:var(--coffee);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sclear:hover{background:var(--khaki);color:var(--paper)}
.search{width:100%;font:inherit;padding:12px 18px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
body:not(.editing) .edonly{display:none}
.hchips{margin:-6px 0 16px}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--coffee);border-color:var(--coffee);color:var(--paper)}
.qlist{display:grid;border-top:1px solid var(--line)}
.qsub{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--coffee);padding:16px 4px 8px;border-bottom:1px dashed var(--line)}
.qsub::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--khaki);flex:none}
.qsub span{font-weight:400;color:var(--muted);font-size:12px}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qnav .qpos{font-family:var(--latin);font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn:disabled{opacity:.4;cursor:default}
.qgroup{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:19px;padding:26px 2px 10px;border-bottom:1px solid var(--line)}
.qgroup:first-child{padding-top:14px}
.qgroup .gn{font-family:var(--latin);font-size:22px;color:var(--coffee);font-variant-numeric:tabular-nums}
.qgroup .gbar{width:1px;height:20px;background:var(--khaki)}
.qitem{display:flex;gap:12px;align-items:baseline;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:15px 4px;cursor:pointer}
.qitem .n{font-family:var(--latin);color:var(--khaki);font-size:18px;min-width:2ch;font-variant-numeric:tabular-nums}
.qitem .t{flex:1;min-width:0}
.qitem .arrow{color:var(--muted)}
.qtitle{margin-top:8px;font-size:clamp(22px,6.2vw,28px);font-weight:700;line-height:1.5;letter-spacing:.02em;text-wrap:wrap;word-break:normal}
.answer{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:14px}
.answer h3{font-family:var(--display);font-size:16px;color:var(--coffee)}
.answer .text{font-size:16px;margin:0;white-space:pre-line}
details.theory{border-top:1px solid var(--line);padding-top:12px}
details.theory summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;font-weight:500}
details.theory summary::-webkit-details-marker{display:none}
details.theory summary::after{content:"＋";color:var(--khaki)}
details.theory[open] summary::after{content:"－"}
details.theory p{margin:10px 0 0;color:var(--muted);font-size:14px;white-space:pre-line}

/* editor sheet */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(40,30,22,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--paper);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;display:grid;gap:14px;
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet{align-items:center}.sheet-card{border-radius:20px}}
.sheet form{display:grid;gap:12px}
.field{display:grid;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.fwrap{position:relative}
.fwrap input,.fwrap textarea{padding-right:46px}
.fclear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:var(--tea);color:var(--coffee);font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fwrap.area .fclear{top:8px;transform:none}
.ssrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center}
.ssrow input{font:inherit;width:100%;padding:10px 46px 10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.ssrow.gone input{text-decoration:line-through;opacity:.5}
.ssord{display:flex;flex-direction:column;gap:2px}
.ssord .btn{padding:0 8px;font-size:12px;line-height:18px}
.sscnt{white-space:nowrap}
.vnote{margin:8px 0 0;font-size:15px;white-space:pre-line;line-height:1.8}
.vship h4{margin:6px 0 4px;font-size:17px;font-weight:700}
.vship ul{margin:0;padding-left:1.6em;display:grid;gap:4px}
.vbtn{display:inline-block;margin-top:6px;background:var(--coffee);color:var(--paper);text-decoration:none;padding:11px 22px;border-radius:8px;font-size:15px}
.vbtn:hover{opacity:.9}
.vfootrow{display:grid;gap:8px;justify-items:start}
.vfoot{margin:0;font-size:13px;color:var(--muted);white-space:pre-line;line-height:1.8}
.refsec{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:22px;margin-top:6px}
.pl{white-space:pre-line;line-height:1.8}
.reft th{background:var(--soft)}
.reft td,.reft th{white-space:normal;padding:10px 12px}
.hl{margin:0;background:var(--soft);border-left:3px solid var(--khaki);padding:14px 16px;border-radius:0 10px 10px 0;white-space:pre-line;font-size:14px;line-height:1.8}
.thumb .tcap{display:grid;gap:2px;padding:4px 4px 2px}
.thumb .tcap b{font-size:13px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb .tcap small{font-size:12px;color:var(--muted)}
.gal.big{grid-template-columns:1fr;gap:14px}
.gal.big .thumb{padding:10px;background:var(--paper)}
.gal.big .thumb img{aspect-ratio:auto;height:auto;object-fit:contain;background:#fff}
.gal.big .tcap{padding:10px 6px 4px}
.gal.big .tcap b{font-size:16px;font-weight:500;white-space:normal}
.gal.big .tcap small{font-size:13px}
.thumb .tcap,.thumb .tcap small{letter-spacing:normal;white-space:normal;overflow-wrap:anywhere}

.frep:hover{background:var(--tea)}
.fchip .fcap{width:100%;min-width:0;font-family:var(--body);font-size:16px;line-height:1.4;padding:8px 10px;margin-top:4px;text-overflow:ellipsis;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.comm{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:4px 10px 4px 4px}
.comm-a{flex:1;min-width:0;display:grid;gap:8px;padding:20px 22px;text-decoration:none;color:var(--ink)}
.comm-a b{font-weight:500;font-size:16px;overflow-wrap:anywhere}
.comm-a small{font-size:14px;color:var(--muted);line-height:1.6}
a.comm-a:hover b{color:var(--coffee)}
.fclear:hover{background:var(--khaki);color:var(--paper)}
.field textarea{min-height:110px;resize:vertical;line-height:1.6}
.sheet .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet .foot .spacer{flex:1}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--paper)}
.status{font-size:13px;color:var(--danger);min-height:1em}
.status.ok{color:var(--coffee);font-weight:500}

/* galleries & links */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.thumb{display:grid;gap:4px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:6px;cursor:zoom-in;text-align:left;min-width:0}
.thumb img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;background:var(--soft)}
.thumb small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdf{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;border-radius:6px;background:var(--soft);font-family:var(--latin);font-size:22px;color:var(--coffee)}
details.brand{background:var(--paper);border:1px solid var(--line);border-radius:14px}
details.brand summary{cursor:pointer;list-style:none;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.brand summary::-webkit-details-marker{display:none}
details.brand summary b{font-size:16px}
details.brand .inner{padding:0 18px 18px;display:grid;gap:10px}
.linklist{display:grid}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);min-width:0}
.lrow:last-child{border-bottom:0}
.lrow a{text-decoration:none;flex:1;min-width:0}
.lrow a b{display:block;color:var(--ink);font-weight:500}
.lrow a small{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;user-select:all;min-width:0;overflow-wrap:anywhere}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(25,18,12,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb-stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff;transform-origin:center center;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
.lb-bar{display:flex;align-items:center;gap:10px}
.lb-bar #lb-out,.lb-bar #lb-in{width:40px;height:40px;padding:0;font-size:20px;line-height:1}
#lb-zoom{color:#F6EEE3;font-size:13px;min-width:46px;text-align:center}
.lb-tip{color:rgba(246,238,227,.7);font-size:12px}
.lightbox .cap{color:#F6EEE3;font-size:14px;text-align:center}

function buildPdf(pages){/* pages: [{bytes:Uint8Array(jpeg),w,h}] -> Blob */

    const cs=`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im${k} Do Q`;
    obj(co,()=>put(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(io,()=>{put(`<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.bytes.length} >>\nstream\n`);put(pg.bytes);put("\nendstream")})});

async function makePdf(btn){const f=D.forms.find(x=>x.id===btn.dataset.pdf);if(!f)return;const o=btn.textContent;btn.disabled=true;btn.textContent="製作 PDF 中…";
  try{const pages=[];
    for(const x of (f.files||[]).filter(x=>!isPdf(x))){const u=await IMG_URL(x.id);if(!u)continue;const im=await imgEl(u);
      const sc=Math.min(1,2400/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);
      const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
      const b64=c.toDataURL("image/jpeg",0.9).split(",")[1],bin=atob(b64),bytes=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)bytes[k]=bin.charCodeAt(k);

  catch(err){btn.textContent="下載失敗，請再試一次";setTimeout(()=>btn.textContent=o,2500)}
  btn.disabled=false}

  ${blocksAt("faq","end")}
</div>`;
function subRank(f){const l=SUBS[f.c];if(!l)return 0;const i=l.indexOf(f.sub);return i<0?l.length:i}
function faqOrdered(){return [...CATS,null].flatMap(c=>D.faq.filter(f=>c?f.c===c:!CATS.includes(f.c)).sort((a,b)=>subRank(a)-subRank(b)||byO(a,b)))}
function faqListHtml(list){
  const grouped=faqCat==="全部";
  const item=f=>`<button class="qitem" data-q="${f.id}"><span class="n">${String(f.i+1).padStart(2,"0")}</span><span class="t">${esc(f.q)}${grouped?"":`<br><span class="tag">${esc(f.sub&&SUBS[f.c]?f.sub:f.c)}</span>`}</span><span class="arrow">›</span></button>`;
  const withSubs=(c,g)=>{const l=SUBS[c];if(!l||!g.some(f=>l.includes(f.sub)))return g.map(item).join("");
    return [...l,""].map(sb=>{const h=g.filter(f=>(l.includes(f.sub)?f.sub:"")===sb);return h.length?`<div class="qsub">${esc(sb||"其他")}<span>${h.length}</span></div>`+h.map(item).join(""):""}).join("")};
  if(!grouped)return CATS.includes(faqCat)?withSubs(faqCat,list):list.map(item).join("");
  return [...CATS,"其他"].map((c,gi)=>{const g=list.filter(f=>(CATS.includes(f.c)?f.c:"其他")===c);return g.length?`<div class="qgroup"><span class="gn">${String(gi+1).padStart(2,"0")}</span><span class="gbar"></span><span>${esc(c)}</span></div>`+withSubs(c,g):""}).join("");
}
function renderFaqList(){
  const list=faqOrdered().map((f,i)=>({...f,i})).filter(f=>(faqCat==="全部"||f.c===faqCat)&&(!faqQ||(f.q+f.a+f.w).includes(faqQ)));
  $("#faq-count").textContent=`共 ${list.length} 題`;
  $("#faq-list").innerHTML=faqListHtml(list)
    ||(D.faq.length?`<div class="empty">找不到相關問題，換個關鍵字試試。</div>`:emptyMsg("faq"));
}
function initFaq(){
  $("#faq-q").addEventListener("input",e=>{faqQ=e.target.value.trim();$("#faq-clear").hidden=!e.target.value;renderFaqList()});
  $("#faq-clear").addEventListener("click",()=>{const q=$("#faq-q");q.value="";faqQ="";$("#faq-clear").hidden=true;renderFaqList();q.focus()});
  $("#faq-cats").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;faqCat=b.dataset.c;render()});
  renderFaqList();
}
V.q=id=>{

  return `<div class="wrap view">

    <div class="qnav">${p?`<button class="btn" data-q="${p.id}">‹ 上一題</button>`:`<button class="btn" disabled>‹ 上一題</button>`}<span class="qpos">${String(i+1).padStart(2,"0")} / ${ord.length}</span>${n?`<button class="btn" data-q="${n.id}">下一題 ›</button>`:`<button class="btn" disabled>下一題 ›</button>`}</div>
    <div><span class="tag">${esc(f.c)}${f.sub&&SUBS[f.c]?"・"+esc(f.sub):""}</span><h2 class="qtitle">${esc(f.q)}</h2></div>
    <div class="answer">

      <p class="text">${esc(f.a)}</p>

  </div>`;
};

let fdrag=null;
document.addEventListener("pointerdown",e=>{
  const h=e.target.closest("[data-drag]");if(!h||!ed||ed.uploading)return;

document.addEventListener("pointermove",e=>{
  if(!fdrag||e.pointerId!==fdrag.id)return;e.preventDefault();
  const box=$("#f-files"),chips=[...box.querySelectorAll(".fchip")];
  const t=chips.findIndex(c=>{const r=c.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom});
  if(t>=0&&t!==fdrag.i){
    const [m]=ed.files.splice(fdrag.i,1);ed.files.splice(t,0,m);
    box.insertBefore(fdrag.el,t>fdrag.i?chips[t].nextSibling:chips[t]);fdrag.i=t;
    [...box.querySelectorAll(".fchip")].forEach((c,k)=>{const n=c.querySelector(".fno");if(n)n.lastChild.textContent=`第 ${k+1} 張`});
  }
  const card=document.querySelector("#sheet .sheet-card"),r=card.getBoundingClientRect();

async function uploadFiles(list){
  if(!AS)return;
  for(const file of list){
    ed.uploading++;drawFiles();
    try{const r=await AS.upload(file,file.type?undefined:{type:/\.pdf$/i.test(file.name)?"application/pdf":"image/jpeg"});ed.files.push({id:r.id,name:file.name,type:r.contentType})}
    catch(e){$("#sh-status").textContent=e&&e.code==="too_large"?`「${file.name}」超過 20MB，請壓縮後再上傳。`:e&&e.code==="unsupported_type"?`「${file.name}」格式不支援，請用 JPG、PNG 或 PDF。`:`「${file.name}」上傳失敗，請再試一次。`}
    ed.uploading--;drawFiles();
  }
  $("#f-files-in").value="";
}
async function replaceFile(i,file){
  if(!AS||!ed.files[i])return;
  ed.replacing=i;ed.uploading++;drawFiles();
  try{const r=await AS.upload(file,file.type?undefined:{type:/\.pdf$/i.test(file.name)?"application/pdf":"image/jpeg"});
    const old=ed.files[i];ed.files[i]={...old,id:r.id,name:file.name,type:r.contentType};
    $("#sh-status").classList.add("ok");$("#sh-status").textContent=`已更換第 ${i+1} 張，按「儲存」後生效。`}
  catch(e){$("#sh-status").classList.remove("ok");$("#sh-status").textContent=e&&e.code==="too_large"?`「${file.name}」超過 20MB，請壓縮後再上傳。`:e&&e.code==="unsupported_type"?`「${file.name}」格式不支援，請用 JPG、PNG 或 PDF。`:`「${file.name}」上傳失敗，請再試一次。`}
  ed.replacing=null;ed.uploading--;drawFiles();
}

/* keep 排序 numbers tidy: 1,2,3… within each group */
const SCOPE={faq:"c",tools:"g",notes:"page",vendors:"where",blocks:"page",bsubs:"b"};
const ocmp=(a,b)=>(a.o??999)-(b.o??999)||(a.id<b.id?-1:a.id>b.id?1:0);
const GRPF={tools:["g","其他"],spaces:["region","其他"],products:["cat",""]};
async function renumber(col,item){
  if(!DB||!D[col]||!SCHEMA[col]||!SCHEMA[col].fields.some(f=>f[0]==="o"))return;
  const k=SCOPE[col],sc=v=>k?(v[k]||""):"";
  const others=D[col].filter(d=>d.id!==item.id);
  const groups=new Set(others.map(sc));if(!item._del)groups.add(sc(item));
  for(const g of groups){
    const list=others.filter(d=>sc(d)===g).sort(ocmp);
    if(!item._del&&sc(item)===g){const p=Math.max(0,Math.min(list.length,Math.round(+item.o||list.length+1)-1));list.splice(p,0,item)}
    for(let i=0;i<list.length;i++){if(list[i].o!==i+1)await DB.collection(col).doc(list[i].id).update({o:i+1})}
  }
}
async function saveEditor(next){
  if(!ed||!DB)return;
  const vals={};
  if(ed.uploading){$("#sh-status").textContent="檔案還在上傳，請稍等。";return}
  SCHEMA[ed.col].fields.forEach(([k,,type])=>{if(type==="files"){vals[k]=ed.files;return}const el=$("#f-"+k);vals[k]=type==="num"?(parseFloat(el.value)||0):el.value.trim()});
  if(ed.col==="faq"&&!SUBS[vals.c])vals.sub="";
  {const nk={tools:["newg","g"],spaces:["newregion","region"],products:["newcat","cat"]}[ed.col];if(nk){if(vals[nk[0]])vals[nk[1]]=vals[nk[0]];delete vals[nk[0]]}}
  if(ed.col==="grp"){
    const nn=vals.gname;if(!nn){$("#sh-status").textContent="請填寫名稱。";return}
    const [gc,...rest]=ed.id.split("::"),gv=rest.join("::"),[gf,fb]=GRPF[gc];
    $("#sh-save").disabled=true;
    try{const order=GL(gc);for(const t of D[gc].filter(t=>(t[gf]||fb)===gv)){if(t[gf]!==nn)await DB.collection(gc).doc(t.id).update({[gf]:nn})}
      if(gc==="tools"||gc==="products"){const rest=order.filter(x=>x!==gv&&x!==nn),pos=Math.min(Math.max(1,Math.round(vals.gpos)||1),rest.length+1);rest.splice(pos-1,0,nn);
        const go={};for(const k in SITE.gord||{})if(!k.startsWith(gc+"::"))go[k]=SITE.gord[k];rest.forEach((x,i)=>go[gc+"::"+x]=i+1);const gd={...(SITE.gdesc||{})};delete gd[ed.id];if(gc==="tools"&&vals.gdesc)gd[gc+"::"+nn]=vals.gdesc;await DB.doc("site/main").set({...SITE,gord:go,gdesc:gd})}if(gc==="spaces"&&spReg===gv)spReg=nn;closeEditor()}
    catch(e){$("#sh-save").disabled=false;$("#sh-status").textContent="儲存失敗，請檢查網路後再試一次。"}
    return}
  const req={blocks:"t",bsubs:"t",pages:"t",products:"name",comms:"name",refs:"t",faq:"q",vendors:"n",prices:"brand",groups:"name",tools:"name",spaces:"name",recruit:"t",forms:"t",notes:"t"}[ed.col];
  if(!/^site/.test(ed.col)&&!vals[req]){$("#sh-status").textContent="請先填寫「"+SCHEMA[ed.col].fields.find(f=>f[0]===req)[1]+"」。";return}
  $("#sh-save").disabled=true;$("#sh-savenew").disabled=true;$("#sh-status").textContent="";$("#sh-status").classList.remove("ok");
  try{
    if(/^site/.test(ed.col))await DB.doc("site/main").set({...SITE,...vals});
    else{
      const {id:_,...rest}=ed.old||{};
      const body={...rest,...vals,ex:false};
      if(ed.id){await DB.collection(ed.col).doc(ed.id).set(body);renumber(ed.col,{...body,id:ed.id}).catch(()=>{});
        const keep=new Set((vals.files||[]).map(f=>f.id));
        if(AS&&ed.old&&ed.old.files)for(const f of ed.old.files)if(!keep.has(f.id))AS.delete(f.id).catch(()=>{});}
      else{const ref=await DB.collection(ed.col).add(body);renumber(ed.col,{...body,id:ref.id}).catch(()=>{});if(ed.col==="faq"&&!next){closeEditor();go("q",ref.id);return}}
    }
    if(next){
      const col=ed.col,keep={faq:["c","sub"],notes:["page"],vendors:["where"],tools:["g"],spaces:["region","platform"],prices:[],groups:[],recruit:[],forms:[]}[col]||[];
      const preset={};keep.forEach(k=>{if(vals[k])preset[k]=vals[k]});
      openEditor(col,null,preset);
      const st=$("#sh-status");st.classList.add("ok");st.textContent="已儲存！可以繼續新增下一筆。";
      return;
    }
    closeEditor();
  }catch(e){$("#sh-save").disabled=false;$("#sh-savenew").disabled=false;$("#sh-status").textContent=e&&e.code==="quota_exceeded"?"資料量已達上限，請先刪除一些項目。":"儲存失敗，請檢查網路後再試一次。"}
}

const IMGC=new Map();
function dataToUrl(d){const [h,b64]=d.split(",");const mime=(h.match(/data:([^;]+)/)||[])[1]||"image/jpeg";const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return window.URL.createObjectURL(new Blob([u8],{type:mime}))}
function loadImg(id){if(!id)return Promise.resolve(null);if(IMGC.has(id))return IMGC.get(id);
  const p=fs.doc(P("images/"+id)).get().then(s=>{const d=s.exists?s.data():null;if(!d||!d.data)return null;let str=d.data;
    if(d.parts>1){return Promise.all(Array.from({length:d.parts-1},(_,i)=>fs.doc(P("images/"+id+"_p"+(i+1))).get())).then(ps=>{ps.forEach(x=>str+=x.exists?x.data().data:"");return dataToUrl(str)})}
    return dataToUrl(str)}).catch(()=>null);
  IMGC.set(id,p);return p}
function hydrateImages(root){root=root||document;
  root.querySelectorAll("img[data-img]").forEach(el=>{const id=el.dataset.img;el.classList.add("imgwait");loadImg(id).then(u=>{if(u&&el.dataset.img===id){el.src=u;el.classList.remove("imgwait")}})});
  root.querySelectorAll("a[data-imgh]").forEach(el=>{const id=el.dataset.imgh;loadImg(id).then(u=>{if(u&&el.dataset.imgh===id)el.href=u})})}
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1){if(n.matches&&(n.matches("img[data-img]")||n.matches("a[data-imgh]")))hydrateImages(n.parentNode);else if(n.querySelector&&n.querySelector("[data-img],[data-imgh]"))hydrateImages(n)}}).observe(document.body,{childList:true,subtree:true});

function readAsDataURL(blob){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(blob)})}
async function compressImage(file){
  if(/pdf/i.test(file.type)||/\.pdf$/i.test(file.name))return {data:await readAsDataURL(file),type:"application/pdf"};
  const url=window.URL.createObjectURL(file);
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
  let max=2000,q=0.82,out;
  for(let t=0;t<8;t++){const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",q);
    if(out.length<900000)break; if(q>0.6)q-=0.08;else max=Math.round(max*0.85)}
  window.URL.revokeObjectURL(url);return {data:out,type:"image/jpeg"}}
async function saveImageDoc(id,data,type,name){
  const CH=900000;const parts=Math.ceil(data.length/CH);
  await fs.doc(P("images/"+id)).set({data:data.slice(0,CH),type,name:name||"",parts,ts:firebase.firestore.FieldValue.serverTimestamp()});
  for(let i=1;i<parts;i++)await fs.doc(P("images/"+id+"_p"+i)).set({data:data.slice(i*CH,(i+1)*CH)});
}

  async delete(id){const s=await fs.doc(P("images/"+id)).get();const n=s.exists?(s.data().parts||1):1;await fs.doc(P("images/"+id)).delete();for(let i=1;i<n;i++)await fs.doc(P("images/"+id+"_p"+i)).delete();IMGC.delete(id)}
};

  </form><div class="msg" id="g-msg"></div>
  <p class="who">目前登入：${esc(ME.email||"")}　<button class="link" id="g-logout">登出</button></p>`)}
function gateStatus(st){
  const T={pending:["審核中","已收到妳的申請，管理者審核通過後就能瀏覽內容。通過後重新整理這個頁面即可。"],rejected:["申請未通過","很抱歉，這次的申請沒有通過。如有疑問請直接聯繫管理者。"],disabled:["帳號已停用","這個帳號目前無法瀏覽內容，如有疑問請聯繫管理者。"]}[st]||["無法瀏覽","請聯繫管理者。"];
  G(`<div class="eyebrow">MEMBERS ONLY</div><h1>${T[0]}</h1><p>${T[1]}</p>
  ${st==="pending"?`<button class="cta" id="g-refresh">重新檢查</button>`:""}<div class="msg" id="g-msg"></div>
  <p class="who">目前登入：${esc(ME.email||"")}　<button class="link" id="g-logout">登出</button></p>`)}
function gateVerifyAdmin(){
  G(`<div class="eyebrow">ADMIN</div><h1>請先驗證 Email</h1><p>管理者帳號需要先完成 Email 驗證。請到 ${esc(ME.email)} 的信箱點驗證連結，完成後按「我已驗證」。</p>
  <button class="cta" id="g-refresh">我已驗證</button><button class="link" id="g-resend">重新寄送驗證信</button><div class="msg" id="g-msg"></div>
  <p class="who"><button class="link" id="g-logout">登出</button></p>`)}

function stopData(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[]}
function startData(){
  stopData();DB={collection:c=>fs.collection(P(c)),doc:p=>fs.doc(P(p))};dbState="ok";
  COLS.forEach(c=>unsubs.push(DB.collection(c).onSnapshot(s=>{D[c]=s.docs.map(d=>({...d.data(),id:d.id})).sort(byO);loaded[c]=true;render()},()=>{loaded[c]=true;render()})));
  unsubs.push(DB.doc("config/subs").onSnapshot(s=>{const d=s.exists?s.data():null;if(d&&Array.isArray(d["術後回家"]))SUBS={...SUBS,"術後回家":[...d["術後回家"]]};render()},()=>{}));
  unsubs.push(DB.doc("site/main").onSnapshot(s=>{SITE=s.exists?{...s.data()}:{};render()},()=>{}));
  if(isAdmin)unsubs.push(fs.collection(P("members")).onSnapshot(s=>{MEMBERS=s.docs.map(d=>({...d.data(),id:d.id}));render()},()=>{}));
}
function showApp(){
  $("#gate").hidden=true;$("#appwrap").hidden=false;
  canEdit=isAdmin||(MEMBER&&MEMBER.status==="approved"&&MEMBER.role==="editor");
  $("#edit-toggle").hidden=!canEdit;
  $("#who").textContent=(ME.email||"")+(isAdmin?"（管理者）":"");
  startData();
  if(!booted){booted=true;go((location.hash||"").slice(1)||"home")}else render();
}
let memberUnsub=null;
async function onUser(u){
  ME=u;if(memberUnsub){memberUnsub();memberUnsub=null}
  if(!u){stopData();isAdmin=false;MEMBER=null;gateLogin();return}
  if(ADMIN_EMAILS.includes((u.email||"").toLowerCase())){if(!u.emailVerified){gateVerifyAdmin();return}isAdmin=true;MEMBER=null;showApp();return}
  isAdmin=false;G(`<p>載入中…</p>`);
  memberUnsub=fs.doc(P("members/"+u.uid)).onSnapshot(s=>{
    MEMBER=s.exists?s.data():null;
    if(!MEMBER){stopData();gateApply();return}
    if(MEMBER.status==="approved"){if($("#appwrap").hidden)showApp();else{canEdit=MEMBER.role==="editor";$("#edit-toggle").hidden=!canEdit;render()}}
    else{stopData();gateStatus(MEMBER.status)}
  },()=>{gateStatus("error")});
}
auth.getRedirectResult().catch(err=>{if(err&&err.code)setTimeout(()=>gmsg(AUTHERR(err.code)),300)});
auth.onAuthStateChanged(onUser);
$("#logout-btn").addEventListener("click",()=>{document.body.classList.remove("open");auth.signOut()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){try{fs.disableNetwork().then(()=>fs.enableNetwork())}catch(e){}}});

/* ---- member management (admin) ---- */
const MST={pending:"待審核",approved:"已通過",rejected:"未通過",disabled:"已停用"};
V.members=()=>{
  if(!isAdmin)return `<div class="wrap view">${back()}<div class="empty">只有管理者可以查看。</div></div>`;
  const ts=x=>x&&x.toDate?x.toDate().toLocaleString("zh-TW",{hour12:false}):"";
  const grp=st=>MEMBERS.filter(m=>(m.status||"pending")===st).sort((a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0));
  const card=m=>`<div class="mrow"><div class="row"><b>${esc(m.name||"（未填姓名）")}</b><span class="acts"><span class="mtag ${esc(m.status)}">${MST[m.status]||m.status}</span>${m.role==="editor"?`<span class="mtag">編輯者</span>`:""}</span></div>
   <dl class="kv" style="margin:0">${kvRow("Email",m.email)}${kvRow("LINE ID",m.line)}${kvRow("手機",m.phone)}${kvRow("學員期別",m.batch)}</dl>
   <div class="small">申請時間：${esc(ts(m.createdAt))}</div>
   <div class="acts">${m.status==="pending"?`<button class="cta" style="padding:7px 16px" data-mact="approve" data-id="${m.id}">通過</button><button class="btn del" data-mact="reject" data-id="${m.id}">拒絕</button>`:""}
   ${m.status==="approved"?`<button class="btn" data-mact="${m.role==="editor"?"viewer":"editor"}" data-id="${m.id}">${m.role==="editor"?"取消編輯權限":"給予編輯權限"}</button><button class="btn del" data-mact="disable" data-id="${m.id}">停用</button>`:""}
   ${(m.status==="rejected"||m.status==="disabled")?`<button class="btn" data-mact="approve" data-id="${m.id}">改為通過</button><button class="btn del" data-mact="remove" data-id="${m.id}">刪除申請</button>`:""}</div></div>`;
  const sec=(st,t)=>{const l=grp(st);return `<h3 style="margin-top:8px">${t}（${l.length}）</h3>${l.length?`<div class="mem">${l.map(card).join("")}</div>`:`<div class="empty">目前沒有。</div>`}`};
  return `<div class="wrap view">${back()}
  <div class="sec-head"><div class="eyebrow">MEMBERS</div><h2>會員管理</h2><p>${esc(SITE_NAME)} 的會員名單。通過後對方重新整理頁面就能瀏覽；停用後馬上看不到內容。</p></div>
  ${sec("pending","待審核")}${sec("approved","已通過")}${sec("rejected","未通過")}${sec("disabled","已停用")}
  <div class="refsec"><h3>資料匯入</h3><p class="small" style="margin:0">搬家用：選擇 Claude 提供的匯入檔（.json），會把內容和圖片寫進這個網站。重複匯入會覆蓋同名項目。</p>
   <input type="file" id="imp-file" accept="application/json,.json"></div>
  <div class="refsec"><h3>備份與複製</h3>
   <p class="small" style="margin:0">「下載備份」會把這個網站目前的所有內容和圖片存成一個檔案，之後可以用上面的「資料匯入」還原。</p>
   <div><button class="btn" id="bk-btn">⬇ 下載這個網站的備份</button></div>
   ${SITES.filter(x=>x[0]!==SITE_ID).map(x=>`<p class="small" style="margin:8px 0 0">把「${esc(x[1])}」的全部內容和圖片複製到這個網站（${esc(SITE_NAME)}）。會員名單不會複製。</p>
   <label class="small" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="cp-wipe" checked style="margin-top:4px">先清空這個網站原本的內容，複製完會跟「${esc(x[1])}」一模一樣（不勾選的話，這邊多出來的內容會保留）</label>
   <div><button class="cta" data-copyfrom="${x[0]}" data-copyname="${esc(x[1])}">從「${esc(x[1])}」複製全部內容</button></div>`).join("")}
  </div>
 </div>`};
const SITES=[["tonghang","熱蠟工作室-同行"],["paopao","熱蠟工作室-泡泡🫧"]];
const DATA_COLS=()=>[...new Set([...COLS,"site","config"])];
const toast=t=>{let st=$("#imp-toast");if(!st){st=document.createElement("div");st.id="imp-toast";document.body.appendChild(st)}st.hidden=false;st.textContent=t;return st};
async function readSite(site){const Q=c=>fs.collection("sites/"+site+"/"+c);const docs=[];
  for(const c of DATA_COLS()){const q=await Q(c).get();q.forEach(d=>docs.push({path:c+"/"+d.id,data:d.data()}))}
  const iq=await Q("images").get();const imgs=[];iq.forEach(d=>imgs.push({id:d.id,data:d.data()}));return {docs,imgs}}
document.addEventListener("click",async e=>{
  if(!isAdmin)return;
  if(e.target.id==="bk-btn"){const b=e.target;b.disabled=true;const st=toast("備份中，正在讀取內容…");
    try{const {docs,imgs}=await readSite(SITE_ID);const byId={};imgs.forEach(x=>byId[x.id]=x.data);
      const images=imgs.filter(x=>!/_p[0-9]+$/.test(x.id)).map(x=>{let d=x.data.data||"";for(let i=1;i<(x.data.parts||1);i++)d+=(byId[x.id+"_p"+i]||{}).data||"";return {id:x.id,data:d,type:x.data.type||"image/jpeg",name:x.data.name||""}});
      const J={site:SITE_ID,siteName:SITE_NAME,exportedAt:new Date().toISOString(),docs:docs.map(d=>({path:d.path,data:JSON.parse(JSON.stringify(d.data))})),images};
      const day=new Date().toISOString().slice(0,10);saveBlob(new Blob([JSON.stringify(J)],{type:"application/json"}),`備份-${SITE_NAME.replace(/[^一-龥A-Za-z0-9-]/g,"")}-${day}.json`);
      st.textContent=`備份完成：${docs.length} 筆內容、${images.length} 張圖片。`;setTimeout(()=>st.hidden=true,6000)}
    catch(err){st.textContent="備份失敗："+(err.code||err.message||err)}b.disabled=false;return}
  const cb=e.target.closest("[data-copyfrom]");if(!cb)return;
  if(!cb.classList.contains("armed")){cb.classList.add("armed");const t=cb.textContent;cb.textContent="確定要複製嗎？再按一次開始";setTimeout(()=>{cb.classList.remove("armed");cb.textContent=t},4000);return}
  const src=cb.dataset.copyfrom,wipe=!!($("#cp-wipe")&&$("#cp-wipe").checked);cb.disabled=true;const st=toast("讀取「"+cb.dataset.copyname+"」的內容…");
  try{const {docs,imgs}=await readSite(src);
    if(wipe){st.textContent="清空這個網站原本的內容…";const cur=await readSite(SITE_ID);const keep=new Set([...docs.map(d=>d.path),...imgs.map(x=>"images/"+x.id)]);
      const del=[...cur.docs.map(d=>d.path),...cur.imgs.map(x=>"images/"+x.id)].filter(p=>!keep.has(p));
      for(let i=0;i<del.length;i+=400){const bt=fs.batch();del.slice(i,i+400).forEach(p=>bt.delete(fs.doc(P(p))));await bt.commit()}}
    let n=0;const tot=docs.length+imgs.length;
    for(let i=0;i<docs.length;i+=400){const bt=fs.batch();docs.slice(i,i+400).forEach(d=>bt.set(fs.doc(P(d.path)),d.data));await bt.commit();n+=Math.min(400,docs.length-i);st.textContent=`複製中… ${n}/${tot}`}
    for(const x of imgs){await fs.doc(P("images/"+x.id)).set(x.data);n++;st.textContent=`複製中… ${n}/${tot}`}
    IMGC.clear();st.textContent=`複製完成：${docs.length} 筆內容、${imgs.filter(x=>!/_p[0-9]+$/.test(x.id)).length} 張圖片。`;setTimeout(()=>st.hidden=true,8000)}
  catch(err){st.textContent="複製失敗："+(err.code||err.message||err)+"（可以再按一次繼續）"}
  cb.disabled=false;cb.classList.remove("armed");cb.textContent="從「"+cb.dataset.copyname+"」複製全部內容";
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-mact]");if(!b||!isAdmin)return;
  const id=b.dataset.id,a=b.dataset.mact,ref=fs.doc(P("members/"+id));
  if(a==="remove"||a==="disable"||a==="reject"){if(!b.classList.contains("armed")){b.classList.add("armed");const t=b.textContent;b.textContent="再按一次確認";setTimeout(()=>{b.classList.remove("armed");b.textContent=t},3000);return}}
  b.disabled=true;
  try{if(a==="approve")await ref.update({status:"approved",reviewedAt:firebase.firestore.FieldValue.serverTimestamp()});
    else if(a==="reject")await ref.update({status:"rejected",reviewedAt:firebase.firestore.FieldValue.serverTimestamp()});
    else if(a==="disable")await ref.update({status:"disabled"});
    else if(a==="editor"||a==="viewer")await ref.update({role:a});
    else if(a==="remove")await ref.delete();}
  catch(err){b.disabled=false;b.textContent="失敗，請再試"}
});
document.addEventListener("change",async e=>{
  if(e.target.id!=="imp-file"||!isAdmin)return;const f=e.target.files[0];if(!f)return;let st=$("#imp-toast");if(!st){st=document.createElement("div");st.id="imp-toast";document.body.appendChild(st)}st.hidden=false;
  try{st.textContent="讀取檔案中…";const J=JSON.parse(await f.text());if(J.site&&J.site!==SITE_ID){st.textContent=`這個檔案是給「${J.siteName||J.site}」的，請在對的網站匯入。`;return}
    const docs=J.docs||[],imgs=J.images||[];let n=0;const tot=docs.length+imgs.length;
    for(let i=0;i<docs.length;i+=400){const bt=fs.batch();docs.slice(i,i+400).forEach(d=>bt.set(fs.doc(P(d.path)),d.data));await bt.commit();n+=Math.min(400,docs.length-i);st.textContent=`匯入中… ${n}/${tot}`}
    for(const im of imgs){await saveImageDoc(im.id,im.data,im.type,im.name);n++;st.textContent=`匯入中… ${n}/${tot}`}
    st.textContent=`匯入完成：${docs.length} 筆內容、${imgs.length} 張圖片。`;setTimeout(()=>st.hidden=true,6000)}
  catch(err){st.textContent="匯入失敗："+(err.message||err)}
  e.target.value="";
});
</script>
